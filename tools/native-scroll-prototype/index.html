<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Scroll Snap Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="feed" aria-label="Native scroll snap test feed">
      <section class="slide coral" data-slide="1"><span>1</span></section>
      <section class="slide violet" data-slide="2"><span>2</span></section>
      <section class="slide cyan" data-slide="3"><span>3</span></section>
      <section class="slide amber" data-slide="4"><span>4</span></section>
      <section class="slide lime" data-slide="5"><span>5</span></section>
    </main>

    <aside class="diagnostics" aria-live="polite">
      <div>active slide <output id="active-slide">1</output></div>
      <div>scrollTop <output id="scroll-top">0</output></div>
      <div><output id="motion-state">settled</output></div>
      <div>last transition: <output id="last-transition">—</output></div>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
